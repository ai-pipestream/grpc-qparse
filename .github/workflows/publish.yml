name: Publish Images

# Builds the service image and pushes it to docker.io/pipestreamai. Every
# push to main republishes :latest; a manual dispatch with a version input
# also tags that version. Docker Hub credentials come from the DOCKER_USER /
# DOCKER_TOKEN org secrets.
#
# amd64-only: the C++ services have no arm64 consumers, so no QEMU setup
# and a single linux/amd64 platform.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Extra version tag (for example 0.1.0); optional'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub (docker.io)
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          tags="docker.io/pipestreamai/grpc-qparse:latest"
          if [ -n "${{ inputs.version }}" ]; then
            tags="$tags,docker.io/pipestreamai/grpc-qparse:${{ inputs.version }}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push the service image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            GRPC_QPARSE_BUILD_VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.tags }}
