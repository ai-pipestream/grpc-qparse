# CI gates for grpc-qparse: the image build compiles the service and runs
# the ctest suite, so a green run here and a green local image build mean
# the same thing; the smoke test then boot-proofs the runtime image.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The jobs only read the repository; the token gets nothing more.
permissions:
  contents: read

jobs:
  image:
    name: image ${{ matrix.arch }}
    # GitHub has native arm64 runners. Forgejo has none, so its arm64 entry
    # builds and boots the image under QEMU on an x64 runner.
    runs-on: ${{ matrix.arch == 'arm64' && github.server_url == 'https://github.com' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # Both architectures the publish workflow ships, each built natively.
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to Docker Hardened Images (dhi.io)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      # The image build runs the test suite itself, so this also proves the
      # tests pass in a clean container with no host toolchain state.
      - name: docker build
        run: docker buildx build --load --platform linux/${{ matrix.arch }} -t grpc-qparse:ci .
      # Library closure, boot to listening under the hardened run flags
      # (which proves the engine finds its font resources), uid 65532.
      - name: Boot-proof the runtime image
        run: ./scripts/smoke-test.sh grpc-qparse:ci
