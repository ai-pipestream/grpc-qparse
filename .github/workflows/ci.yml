# CI gates for grpc-qparse: the image build compiles the service and runs
# the ctest suite, so a green run here and a green local image build mean
# the same thing; the smoke test then boot-proofs the runtime image.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The jobs only read the repository; the token gets nothing more.
permissions:
  contents: read

jobs:
  image:
    name: image ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    # Both architectures the publish workflow ships, each built natively.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      # The image build runs the test suite itself, so this also proves the
      # tests pass in a clean container with no host toolchain state.
      - name: docker build
        run: docker build -t grpc-qparse:ci .
      # Library closure, boot to listening under the hardened run flags
      # (which proves the engine finds its font resources), uid 65532.
      - name: Boot-proof the runtime image
        run: ./scripts/smoke-test.sh grpc-qparse:ci
